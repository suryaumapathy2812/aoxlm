[project]
name = "aoxlm"
version = "0.1.0"
description = "Audio-Output LLM with Structured Transcription - Audio LLM + Whisper-quality timestamps"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Surya Umapathy", email = "surya@example.com" }
]
requires-python = ">=3.10"
keywords = [
    "speech-to-text",
    "audio-llm",
    "timestamps",
    "transcription",
    "qwen2-audio",
    "asr"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "peft>=0.10.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "numba>=0.57.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
train = [
    "wandb>=0.16.0",
    "datasets>=2.16.0",
]

[project.urls]
Homepage = "https://github.com/suryaumapathy2812/aoxlm"
Documentation = "https://github.com/suryaumapathy2812/aoxlm#readme"
Repository = "https://github.com/suryaumapathy2812/aoxlm.git"
Issues = "https://github.com/suryaumapathy2812/aoxlm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
